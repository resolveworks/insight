[package]
name = "insight-core"
version = "0.3.0"
description = "Core business logic for Insight - no Tauri dependency"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# iroh P2P
iroh = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = "0.101"
iroh-io = "0.6"

# PDF processing (default features off: the `time` feature of 0.44.0 is broken
# upstream, see lopdf issue #518 — we don't use PDF date conversion)
lopdf = { version = "0.44", default-features = false, features = ["rayon"] }

# milli from meilisearch — full-text keyword search
milli = { git = "https://github.com/meilisearch/meilisearch.git", tag = "v1.53.1" }
# milli's Settings::execute / indexer::index take &IpPolicy even without embedders
http-client = { git = "https://github.com/meilisearch/meilisearch.git", tag = "v1.53.1", package = "http-client" }
bumpalo = "3"
fst = "0.4.7"
roaring = "0.10.7"
# milli serializes SmartString but relies on rhai's feature flags to enable
# smartstring/serde; declare it explicitly so it doesn't depend on unification
smartstring = { version = "1", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
time = "0.3"

# Random
rand = "0.9"

# Remote LLM providers
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-openai = { version = "0.41", features = ["responses", "model"] }

# Text chunking for search indexing
text-splitter = "0.32"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
